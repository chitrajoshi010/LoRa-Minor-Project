## IDF Component Manager manifest for the merged forest-monitor firmware.
##
## RadioLib is always needed (all roles use the LoRa radio). The TFLite/DSP and
## DHT dependencies are only *compiled* for the roles that REQUIRE them (see
## main/CMakeLists.txt); they are still downloaded for every target but not
## built into the gateway image.
dependencies:
  idf: ">=5.0"
  jgromes/radiolib: "^7.7.1"
  espressif/esp-tflite-micro: "^1.3.5"
  espressif/esp-dsp: ">=1.0.0"
  chmorgan/esp-dht: "*"
