## IDF Component Manager manifest for the merged forest-monitor firmware.
##
## RadioLib is always needed (all roles use the LoRa radio). The TFLite/DSP
## dependencies are only *compiled* for the roles that REQUIRE them (see
## main/CMakeLists.txt); they are still downloaded for every target but not
## built into the gateway image.
##
## DHT22 support is vendored directly in main/sensors/dht22.cpp (no managed
## component) - the previously declared "chmorgan/esp-dht" dependency does
## not exist in the Component Registry or on GitHub and broke dependency
## resolution for every role. See main/sensors/dht22.cpp for details.
dependencies:
  idf: ">=5.0"
  jgromes/radiolib: "^7.7.1"
  espressif/esp-tflite-micro: "^1.3.5"
  espressif/esp-dsp: ">=1.0.0"
